name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/integrate-LTM]
  # Run on every PR regardless of base branch so syntax/test checks gate
  # feature-branch PRs (e.g. into feature/integrate-LTM), not just main/develop.
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      # Fast fail-first syntax check (no dependencies required) so a broken
      # commit — e.g. an auto-generated "Potential fix" that drops a brace —
      # can never merge and break the live agent import path.
      - name: Compile-check Python sources
        run: python -m compileall -q agent_app/agent_server agent_app/scripts agent_app/workflows etl
      - name: Check frontend lockfile registry URLs
        run: python agent_app/scripts/check_no_databricks_npm_proxy.py
      - name: Install uv
        run: pip install uv
      - name: Sync app dependencies
        working-directory: agent_app
        run: |
          uv sync --dev
      - name: Run app tests
        working-directory: agent_app
        run: uv run pytest tests/ -v

  validate-bundle:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: databricks/setup-cli@main
      - name: Validate app bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        working-directory: agent_app
        run: databricks bundle validate -t dev

  deploy-dev:
    needs: validate-bundle
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: databricks/setup-cli@main
      - name: Deploy app bundle to Dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        working-directory: agent_app
        run: ./scripts/deploy.sh --target dev --full-deploy --run --ci --skip-bootstrap

  deploy-prod:
    needs: validate-bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: databricks/setup-cli@main
      - name: Deploy app bundle to Production
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
        working-directory: agent_app
        run: ./scripts/deploy.sh --target prod --full-deploy --run --ci --skip-bootstrap
